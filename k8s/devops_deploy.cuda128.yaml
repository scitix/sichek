---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sichek-gpu
  namespace: monitoring
  labels:
    app: sichek
spec:
  selector:
    matchLabels:
      app: sichek
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50

  template:
    metadata:
      labels:
        app: sichek
    spec:
      hostPID: true
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: scitix.ai/gpu-type
                    operator: Exists
      tolerations:
      - operator: Exists

      serviceAccountName: sa-sichek

      ############################################################
      # volumes
      ############################################################
      volumes:
      - name: sichek-host
        hostPath:
          path: /var/sichek
          type: DirectoryOrCreate
      - name: sichek-default-spec
        configMap:
          name: sichek-default-spec
      - name: sichek-default-user-config
        configMap:
          name: sichek-default-user-config

      ###########################################################
      # main container
      ###########################################################
      containers:
      - name: sichek
        image: "{{ .registry }}/hisys/sichek:{{ .version }}-ubuntu2004-cuda128"
        imagePullPolicy: Always

        securityContext:
          privileged: true

        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SICHEK_SPEC_URL
          value: {{ .sichek_spec_url }}
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid

        volumeMounts:
        - name: sichek-host
          mountPath: /host/var/sichek

        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                rm -rf /host/var/sichek/run/pods/${POD_UID}

        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail

          HOST="nsenter -t 1 -m -p -n -u -i --"
          echo "[sichek] ensure service started"
          $HOST sichek config sync
          $HOST sichek d start

          echo "[sichek] entering keepalive loop and tailing logs to stdout"
          # Tail the log file so that `kubectl logs` can read sichek's logs directly
          tail -n 100 -F /host/var/sichek/run/current/sichek.log &
          TAIL_PID=$!

          while true; do
            # Only restart when the unit is genuinely down. "activating" (a slow
            # first start, e.g. nvidia-smi probing GPUs) and "active" are healthy,
            # so we never kill an in-progress start; systemd TimeoutStartSec=300
            # is the backstop for a truly stuck start.
            state=$($HOST systemctl show -p ActiveState --value sichek 2>/dev/null || true)
            case "$state" in
              active|activating|reloading) ;;
              *)
                echo "[sichek] service state='${state:-unknown}', restarting"
                $HOST sichek d start
                ;;
            esac
            # Optionally restart tail if it dies, but tail -F is robust against recreation/rotation
            sleep 10
          done

        resources:
          requests:
            cpu: 100m
            memory: 1Mi
          limits:
            cpu: "1"
            memory: 1Gi

      - name: sichek-exporter
        image: "{{ .registry }}/hisys/sichek:{{ .version }}-ubuntu2004-cuda128"
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: sichek-host
          mountPath: /host/var/sichek
        ports:
        - name: metrics
          containerPort: {{ .metrics_port }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail

          RUNTIME=/host/var/sichek/run/current
          timeout=10
          elapsed=0
          while [ ! -S "${RUNTIME}/metrics.sock" ]; do
            if [ $elapsed -ge $timeout ]; then
              echo "[sichek] ERROR: ${RUNTIME}/metrics.sock not ready after ${timeout}s"
              exit 1
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done

          echo "[sichek] ${RUNTIME}/metrics.sock is ready, starting exporter..."
          sichek exporter \
            --metrics-socket ${RUNTIME}/metrics.sock \
            --listen :19092

        resources:
          requests:
            cpu: 100m
            memory: 1Mi
          limits:
            cpu: "1"
            memory: 1Gi

      - name: dcgm-prof-watchdog
        image: "{{ .registry }}/hisys/sichek:{{ .version }}"
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DCGM_PORT
          value: "9400"
        - name: DCGM_NS
          value: "scitix-monitoring"
        - name: DCGM_LABEL
          value: "app.kubernetes.io/name=dcgm-exporter"
        - name: POLL_SECONDS
          value: "30"
        - name: MISS_THRESHOLD
          value: "3"
        - name: COOLDOWN_SECONDS
          value: "300"
        - name: MAX_PER_HOUR
          value: "6"
        - name: MAX_INEFFECTIVE_RESTARTS
          value: "2"
        - name: PROF_UNSUPPORTED_GPUS
          value: "NVIDIA L40,NVIDIA GeForce RTX 5090"
        - name: PROBE_LOG
          value: "true"
        command: ["/bin/bash", "-c"]
        args:
        - |
          # source: k8s/scripts/dcgm-prof-watchdog.sh (keep in sync)
          set -uo pipefail

          DCGM_PORT="${DCGM_PORT:-9400}"
          DCGM_NS="${DCGM_NS:-monitoring}"
          DCGM_LABEL="${DCGM_LABEL:-app.kubernetes.io/name=dcgm-exporter}"
          KUBECONFIG_PATH="${KUBECONFIG_PATH:-/var/sichek/run/current/kubeconfig}"
          NODE_NAME="${NODE_NAME:-}"
          POLL_SECONDS="${POLL_SECONDS:-30}"
          MISS_THRESHOLD="${MISS_THRESHOLD:-3}"
          COOLDOWN_SECONDS="${COOLDOWN_SECONDS:-300}"
          MAX_PER_HOUR="${MAX_PER_HOUR:-6}"
          # After this many consecutive restarts fail to bring DCGM_FI_PROF_* back, give up
          # on the node and alert instead of churning forever (e.g. nodes with no profiling
          # support, or a persistent evictor a restart cannot fix). Reset when PROF returns.
          MAX_INEFFECTIVE_RESTARTS="${MAX_INEFFECTIVE_RESTARTS:-2}"
          # GPU models that legitimately never expose DCGM_FI_PROF_* — absence is expected,
          # so never restart dcgm on these (comma-separated, exact nvidia-smi names).
          PROF_UNSUPPORTED_GPUS="${PROF_UNSUPPORTED_GPUS:-NVIDIA L40,NVIDIA GeForce RTX 5090}"
          # HOST_CMD runs host binaries via nsenter in-cluster; tests set it empty.
          HOST_CMD="${HOST_CMD:-nsenter -t 1 -m -p -n -u -i --}"
          # WATCHDOG_MAX_LOOPS bounds the loop for tests; empty = run forever.
          WATCHDOG_MAX_LOOPS="${WATCHDOG_MAX_LOOPS:-}"
          # PROBE_LOG=true logs one heartbeat line per poll (and during cooldown) so the
          # watchdog is visibly alive; set to any other value to log only actions/changes.
          PROBE_LOG="${PROBE_LOG:-true}"

          log() { echo "$(date '+%Y-%m-%dT%H:%M:%S%z') [dcgm-prof-watchdog] $*"; }

          # Fetch metrics via STDOUT (never `-o <file>`): curl runs in the host mount
          # namespace via HOST_CMD/nsenter, so a temp file would be written in the host
          # filesystem but read back in the container filesystem — always empty, making
          # PROF look absent on every node. stdout crosses the nsenter boundary cleanly.
          # Prints the response body, then a final line containing the HTTP code. If curl
          # cannot reach 127.0.0.1:${DCGM_PORT} at all, the caller sees code 000 and skips.
          fetch() {
            $HOST_CMD curl -s -m 4 -w $'\n%{http_code}' \
              "http://127.0.0.1:${DCGM_PORT}/metrics" 2>/dev/null
          }

          restart_dcgm() {
            local pods
            pods="$($HOST_CMD kubectl --kubeconfig="${KUBECONFIG_PATH}" --request-timeout=10s \
              get pod -n "${DCGM_NS}" -l "${DCGM_LABEL}" \
              --field-selector "spec.nodeName=${NODE_NAME}" -o name 2>/dev/null)"
            if [ -z "$pods" ]; then
              log "WARN no dcgm-exporter pod matched (ns=${DCGM_NS} label=${DCGM_LABEL} node=${NODE_NAME}); not restarting"
              return 1
            fi
            log "deleting matched dcgm-exporter pod(s): ${pods//$'\n'/ }"
            $HOST_CMD kubectl --kubeconfig="${KUBECONFIG_PATH}" --request-timeout=10s \
              delete pod -n "${DCGM_NS}" -l "${DCGM_LABEL}" \
              --field-selector "spec.nodeName=${NODE_NAME}"
          }

          # sliding 1h window of restart epoch seconds
          restart_times=()
          recent_restarts() {
            local now t c=0 keep=()
            now="$(date +%s)"
            for t in "${restart_times[@]:-}"; do
              if [ -n "$t" ] && [ $((now - t)) -lt 3600 ]; then keep+=("$t"); c=$((c + 1)); fi
            done
            restart_times=("${keep[@]:-}")
            echo "$c"
          }

          # Sleep the cooldown in chunks, emitting a heartbeat, so the log does not go
          # silent for the whole cooldown (which looks like the watchdog has hung).
          cooldown_wait() {
            local left="$COOLDOWN_SECONDS"
            while [ "$left" -gt 0 ]; do
              if [ "$left" -le 30 ]; then
                sleep "$left"; left=0
              else
                sleep 30; left=$((left - 30))
                [ "$PROBE_LOG" = true ] && log "cooldown: ${left}s remaining"
              fi
            done
          }

          # GPU-model gate: some models never expose DCGM_FI_PROF_*, so their absence is
          # expected and must NOT trigger a restart.
          NODE_GPU_NAMES=""
          gpu_names() {   # unique GPU model names (newline-separated), cached
            if [ -z "$NODE_GPU_NAMES" ]; then
              NODE_GPU_NAMES="$($HOST_CMD nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | sed 's/[[:space:]]*$//' | sort -u)"
            fi
            printf '%s' "$NODE_GPU_NAMES"
          }
          gpu_prof_unsupported() {   # returns 0 (true) if EVERY GPU model is in PROF_UNSUPPORTED_GPUS
            local names n rc=0 oldIFS="${IFS:-}"
            names="$(gpu_names)"
            [ -n "$names" ] || return 1   # unknown model -> treat as supported (do not skip)
            IFS=$'\n'
            for n in $names; do
              [ -n "$n" ] || continue
              case ",${PROF_UNSUPPORTED_GPUS}," in
                *",${n},"*) ;;            # this model legitimately has no PROF
                *) rc=1; break ;;         # a PROF-capable model is present -> not skippable
              esac
            done
            IFS="$oldIFS"
            return "$rc"
          }

          log "starting: node=${NODE_NAME} port=${DCGM_PORT} poll=${POLL_SECONDS}s miss=${MISS_THRESHOLD} cooldown=${COOLDOWN_SECONDS}s cap=${MAX_PER_HOUR}/h giveup_after=${MAX_INEFFECTIVE_RESTARTS}"
          miss=0
          loops=0
          ineffective=0        # consecutive restarts since PROF was last seen present
          gaveup=false         # true once we stop restarting a node whose PROF never returns
          gpu_unsup_logged=false  # log the "GPU has no profiling support" note only once
          while true; do
            resp="$(fetch)"
            code="${resp##*$'\n'}"
            body="${resp%$'\n'*}"
            [ -n "$code" ] || code="000"
            if [ "$code" = "200" ]; then
              pc="$(printf '%s\n' "$body" | grep -c '^DCGM_FI_PROF_')"
            else
              pc="-"
            fi
            [ "$PROBE_LOG" = true ] && log "probe: http=${code} prof=${pc}$([ "$gaveup" = true ] && printf ' (gaveup)')"
            if [ "$code" != "200" ]; then
              # curl could not reach 127.0.0.1:${DCGM_PORT} (or non-200): ignore, do not
              # probe further, do not restart.
              miss=0
            else
              if [ "$pc" -gt 0 ]; then
                [ "$miss" -gt 0 ] && log "DCGM_FI_PROF_* present again (${pc} lines), miss reset"
                if [ "$gaveup" = true ]; then
                  log "DCGM_FI_PROF_* restored (${pc} lines); re-arming watchdog"
                  gaveup=false
                fi
                miss=0
                ineffective=0
              elif gpu_prof_unsupported; then
                # This node's GPU model(s) never expose DCGM_FI_PROF_*; absence is expected.
                [ "$gpu_unsup_logged" = true ] || {
                  log "DCGM_FI_PROF_* absent but node GPU(s) [$(gpu_names | paste -sd',' -)] have no profiling support; NOT restarting"
                  gpu_unsup_logged=true
                }
                miss=0
              else
                miss=$((miss + 1))
                [ "$gaveup" = true ] || log "DCGM_FI_PROF_* absent (miss ${miss}/${MISS_THRESHOLD})"
                if [ "$miss" -ge "$MISS_THRESHOLD" ]; then
                  if [ "$gaveup" = true ]; then
                    :   # already gave up on this node; stay quiet until PROF returns
                  elif [ "$ineffective" -ge "$MAX_INEFFECTIVE_RESTARTS" ]; then
                    gaveup=true
                    log "ALERT: restarted dcgm-exporter ${ineffective}x on ${NODE_NAME} but DCGM_FI_PROF_* did not return; giving up until PROF reappears (likely no profiling support or a persistent evictor a restart cannot fix — investigate)"
                  else
                    n="$(recent_restarts)"
                    if [ "$n" -ge "$MAX_PER_HOUR" ]; then
                      log "WARN per-hour restart cap reached (${n}/${MAX_PER_HOUR}); NOT restarting"
                    else
                      log "restarting dcgm-exporter pod on ${NODE_NAME} (miss=${miss}, ineffective=${ineffective}/${MAX_INEFFECTIVE_RESTARTS})"
                      if restart_dcgm; then
                        restart_times+=("$(date +%s)")
                        ineffective=$((ineffective + 1))
                        miss=0
                        log "restart issued; cooldown ${COOLDOWN_SECONDS}s"
                        cooldown_wait
                      else
                        log "WARN kubectl delete failed; will retry next cycle"
                      fi
                    fi
                  fi
                fi
              fi
            fi
            loops=$((loops + 1))
            if [ -n "$WATCHDOG_MAX_LOOPS" ] && [ "$loops" -ge "$WATCHDOG_MAX_LOOPS" ]; then
              log "reached WATCHDOG_MAX_LOOPS=${WATCHDOG_MAX_LOOPS}, exiting"
              break
            fi
            sleep "$POLL_SECONDS"
          done
        resources:
          requests:
            cpu: 50m
            memory: 1Mi
          limits:
            cpu: "1"
            memory: 512Mi

      ############################################################
      # init container
      ############################################################
      initContainers:
      - name: sichek-init
        image: "{{ .registry }}/hisys/sichek:{{ .version }}-ubuntu2004-cuda128"
        imagePullPolicy: Always

        securityContext:
          privileged: true
          runAsUser: 0
          capabilities:
            add: [SYS_ADMIN]

        env:
        - name: SICHEK_VERSION
          value: {{ .version }}
        - name: SICHEK_SPEC_URL
          value: {{ .sichek_spec_url }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid

        volumeMounts:
        - name: sichek-host
          mountPath: /host/var/sichek
        - name: sichek-default-spec
          mountPath: /var/sichek/config/default_spec.yaml
          subPath: default_spec.yaml
        - name: sichek-default-user-config
          mountPath: /var/sichek/config/default_user_config.yaml
          subPath: default_user_config.yaml

        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          set -x

          HOST="nsenter -t 1 -m -p -n -u -i --"
          SICL=$(ls /opt/sichek/dist/sicl-*.run)
          SICHEK_RPM=$(ls /opt/sichek/dist/sichek_*_linux_amd64.rpm)
          SICHEK_DEB=$(ls /opt/sichek/dist/sichek_*_linux_amd64.deb)
          RUNTIME_BASE=/host/var/sichek/run
          HOST_RUNTIME_BASE=/var/sichek/run
          HOST_SICL_INSTALL_PATH=/usr/local/sihpc
          [[ -e "${RUNTIME_BASE}" ]] && rm -rf "${RUNTIME_BASE}"
          mkdir -p "${RUNTIME_BASE}"

          ##########################################################
          # 1. install / verify sichek on host
          ##########################################################
          # 1.1 check existing sichek
          need_install=true
          if $HOST sh -c 'command -v sichek >/dev/null 2>&1'; then
            if $HOST sichek version >/dev/null 2>&1; then
              current_version=$($HOST sichek version 2>&1 | awk '/^Version:/ {print $2}')
            else
              echo "[sichek] sichek exists but cannot run (glibc mismatch?)"
              current_version=""
            fi
            echo "[sichek] found sichek version=${current_version}"
            if [[ "${current_version}" == "${SICHEK_VERSION}" ]]; then
                echo "[sichek] version match(${current_version} == ${SICHEK_VERSION}), skip install"
                need_install=false
            else
                echo "[sichek] version mismatch(${current_version} != ${SICHEK_VERSION}), reinstall"
            fi
          else
            echo "[sichek] sichek not installed"
          fi

          # 1.2 install if needed
          echo "[sichek] node=${NODE_NAME}"
          if [[ "${need_install}" == "true" ]]; then
            $HOST sichek daemon stop || echo "Failed to stop sichek daemon"

            echo "[sichek] install sicl"
            $HOST rm -rf "${HOST_SICL_INSTALL_PATH}"
            cp "$SICL" "${RUNTIME_BASE}/"
            $HOST bash "${HOST_RUNTIME_BASE}/$(basename "$SICL")"
            rm "${RUNTIME_BASE}/$(basename "$SICL")"

            echo "[sichek] install sichek"
            if $HOST sh -c 'command -v rpm >/dev/null 2>&1'; then
              echo "[sichek] install via rpm"
              cp "$SICHEK_RPM" "${RUNTIME_BASE}/"
              $HOST rpm -e sichek || echo "Failed to remove existing sichek"
              $HOST rpm -Uvh --force "${HOST_RUNTIME_BASE}/$(basename "$SICHEK_RPM")"
              rm "${RUNTIME_BASE}/$(basename "$SICHEK_RPM")"
            elif $HOST sh -c 'command -v dpkg >/dev/null 2>&1'; then
              echo "[sichek] install via dpkg"
              cp "$SICHEK_DEB" "${RUNTIME_BASE}/"
              $HOST dpkg -P sichek || echo "Failed to remove existing sichek"
              ###dpkg: warning: while removing sichek, directory '/var/sichek/scripts' not empty so not removed
              ###dpkg: warning: while removing sichek, directory '/var/sichek/config' not empty so not removed
              rm -rf /host/var/sichek/scripts
              rm -rf /host/var/sichek/config
              $HOST dpkg -i "${HOST_RUNTIME_BASE}/$(basename "$SICHEK_DEB")"
              rm "${RUNTIME_BASE}/$(basename "$SICHEK_DEB")"
            else
              echo "[sichek] no rpm / dpkg found on host"
              exit 1
            fi
            cp /var/sichek/config/default_spec.yaml /host/var/sichek/config/default_spec.yaml
            cp /var/sichek/config/default_user_config.yaml /host/var/sichek/config/default_user_config.yaml
          fi

          # 1.3 final version check
          echo "[sichek] final version check"
          if $HOST sichek version >/dev/null 2>&1; then
            final_version=$($HOST sichek version 2>&1 | awk '/^Version:/ {print $2}')
          else
            echo "[sichek] sichek exists but cannot run (glibc mismatch?)"
            final_version=""
          fi
          if [[ "${final_version}" != "${SICHEK_VERSION}" ]]; then
            echo "Installed sichek version (${final_version}) does not match expected (${SICHEK_VERSION})"
            exit 1
          fi
          echo "[sichek] sichek ${final_version} ready"
          
          ##########################################################
          # 2. generate kubeconfig (atomic)
          ##########################################################
          POD_DIR=${RUNTIME_BASE}/pods/${POD_UID}
          CURRENT_LINK=${RUNTIME_BASE}/current
          mkdir -p "${POD_DIR}"
          CA_FILE=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
          SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"

          CA_DATA=$(base64 < "${CA_FILE}" | tr -d '\n')
          TOKEN=$(cat "${TOKEN_FILE}")

          tmp=$(mktemp "${POD_DIR}/kubeconfig.XXXX")
          cat <<EOF > "${tmp}"
          apiVersion: v1
          kind: Config
          clusters:
          - name: local
            cluster:
              server: ${SERVER}
              certificate-authority-data: ${CA_DATA}
          users:
          - name: sichek
            user:
              token: ${TOKEN}
          contexts:
          - name: sichek-context
            context:
              cluster: local
              user: sichek
          current-context: sichek-context
          EOF

          chmod 600 "${tmp}"
          mv "${tmp}" "${POD_DIR}/kubeconfig"

          # Use relative symlink so both host and container resolve current under their view of the mount.
          # (Absolute /var/sichek/... would not resolve inside container which only has /host/var/sichek.)
          ln -sfn "pods/${POD_UID}" "${CURRENT_LINK}"

          HOST_CURRENT=${HOST_RUNTIME_BASE}/current
          TMP_ENV=$(mktemp "${POD_DIR}/env.XXXX")
          cat <<EOF > "${TMP_ENV}"
          FLAGS="--metrics-socket ${HOST_CURRENT}/metrics.sock -s /var/sichek/config/default_spec.yaml -c /var/sichek/config/default_user_config.yaml --log-file ${HOST_CURRENT}/sichek.log"
          KUBECONFIG=${HOST_CURRENT}/kubeconfig
          SICHEK_SPEC_URL={{ .sichek_spec_url }}
          EOF
          chmod 644 "${TMP_ENV}"
          mv "${TMP_ENV}" "${RUNTIME_BASE}/env"

          ###########################################################################
          # 3. delete pod dir in /var/sichek/run/pods except current and canary link
          ###########################################################################
          PODS_DIR="$RUNTIME_BASE/pods"
          CURRENT_TARGET=$(readlink -f "$RUNTIME_BASE/current")
          CANARY_TARGET=$(readlink -f "$RUNTIME_BASE/canary")
          echo "Current points to: $CURRENT_TARGET"
          echo "Canary points to: $CANARY_TARGET"

          for d in "$PODS_DIR"/*; do
            [ -d "$d" ] || continue

            # skip current/canary dir
            if [[ "$d" == "$CURRENT_TARGET" || "$d" == "$CANARY_TARGET" ]]; then
              echo "Skipping $d"
              continue
            fi
            echo "Deleting $d"
            rm -rf "$d"
          done

      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-sichek
  namespace: monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-role-sichek
rules:
  - apiGroups: ["kubeflow.org", ""]
    resources: ["nodes", "pods", "pytorchjobs"]
    verbs: ["get", "list", "patch", "update", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-role-binding-sichek
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io  # Remove the /v1
  kind: ClusterRole
  name: cluster-role-sichek
subjects:
  - kind: ServiceAccount
    name: sa-sichek
    namespace: monitoring
---
# Source: sichek/templates/prometheus.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sichek-exporter
  namespace: monitoring
  labels:
    app: sichek
spec:
  podMetricsEndpoints:
    - interval: 15s  # Scrape interval
      path: /metrics  # Metrics path
      port: metrics
      scrapeTimeout: 10s
      scheme: http
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: sichek